[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "opencropphenotyping"
version = "0.3.0"
description = "Open-source tools for crop phenotyping using multispectral geospatial imagery"
authors = [
    {name = "Aurélien Peter"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "rasterio",
    "geopandas",
    "matplotlib",
    "pillow",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyter",
    "plotly",
]

[project.scripts]
opencropphenotyping = "opencropphenotyping.cli:app"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]
addopts = "-v"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]